# PIM Service Blueprint — simplified, lossless journey model.
#
# Transcribed from Copy_of_PIM_Service_Blueprint_049c.pdf (a single flattened
# 5417x3738 image; text read from high-resolution crops). Wording in `text` is
# verbatim from the board; light OCR-from-raster caveats may apply to a few long
# stickies. The board's phase headers were unlabelled "Phase" placeholders, so the
# five phases below are named for the process stage they contain. Swimlanes map
# 1:1 to the board's lanes. Every card and sticky on the board is represented
# either as a spine/branch step or as an annotation.

title: PIM Service Blueprint
source: Copy_of_PIM_Service_Blueprint_049c.pdf (Miro/FigJam export)
primary_actor: A product (SKU) travelling from Merch creation to published & discoverable online

# The 8-step spine is a consolidation of the board's ~44 process cards, so it does
# not add board objects. Only the 85 annotations (every literal card + sticky)
# reconcile against the board's object count; connectors are advisory.
synthetic_spine: true

expected_counts:
  objects: 85

phases:
  - id: P1
    name: Create & register
  - id: P2
    name: Capture imagery
  - id: P3
    name: Enrich & ingest
  - id: P4
    name: Copywrite
  - id: P5
    name: Categorise, publish & discover

lanes:
  - id: L1
    name: User actions
    front_stage: true
  - id: L2
    name: Merch Team
  - id: L3
    name: Photography Studios
  - id: L4
    name: Online Team & Merkle
  - id: L5
    name: External Suppliers
  - id: L6
    name: Marketing & Website

# The spine: the product's end-to-end path, one step per major stage. The board's
# detailed process cards attach to these as `info`/`system` annotations so the
# spine stays readable while nothing is dropped.
steps:
  - id: S1
    phase: P1
    name: Product & pricing created, SKU registered
    actors: [Merch Team, Buying Team]
    systems: [DSS, PLM, Mainframe, PIM]
    lanes: [L2]

  - id: S2
    phase: P1
    name: PO raised → keycode → visibility in PIM; sample routed to studio
    actors: [Merch Team]
    systems: [Inventory excel sheet, PIM]
    lanes: [L2]

  - id: S3
    phase: P2
    name: Photography — sample shot, retouched and delivered
    actors: [Photography Studios, External Suppliers]
    systems: [SKU Library, Dropbox, MAM]
    lanes: [L3, L5]

  - id: S4
    phase: P3
    name: Merkle builds pipeline report, assigns studios and tracks SKUs
    actors: [Online Team & Merkle]
    systems: [Mainframe export, Pipeline report, SKU Library]
    lanes: [L4]

  - id: S5
    phase: P3
    name: Assets ingested and mandatory data confirmed
    actors: [Online Team & Merkle, External Suppliers]
    systems: [MAM, PIM, SKU Library]
    lanes: [L4, L5]

  - id: S6
    phase: P4
    name: Copy written in Jarvis and QA'd against WGLL
    actors: [Copywriters, Online Team & Merkle]
    systems: [Jarvis, PIM]
    lanes: [L4]

  - id: S7
    phase: P5
    name: Category mapping, final QA and publish to "Ready for Release"
    actors: [Online Team & Merkle]
    systems: [PIM, ERP/Mainframe, Sales Nav mapping]
    lanes: [L4]

  - id: S8
    phase: P5
    name: Product data feeds channels; customer discovers and buys
    actors: [Marketing & Website, Customer]
    systems: [Commercetools, Constructor, Google Feed, Braze, Website]
    lanes: [L6, L1]

branches:
  - id: B1
    name: Sample lost or TAT missed
    from_step: S4
    rejoins: S5
    steps:
      - id: B1.1
        name: Merkle requests a fresh sample / follows up with the studio
        actors: [Online Team & Merkle]
        systems: [Pipeline report]
        lanes: [L4]

  - id: B2
    name: SKU suspended until mandatory data resolved
    from_step: S5
    rejoins: S6
    steps:
      - id: B2.1
        name: SKU held in "suspended" status; Merkle chases owners
        actors: [Online Team & Merkle]
        systems: [PIM, SKU Library]
        lanes: [L4]

cross_links:
  - from: S7
    to: S1
    label: PIM data does not currently flow back into Merchandising systems (broken loop)

